# One-Click-Deploy — Cloudflare Worker
# Pure worker.js deployment. No JSX/build pipeline is required.

name = "one-click-deploy"
main = "worker.js"
compatibility_date = "2026-09-02"
workers_dev = true

# Optional KV binding used for deployment status and template cache.
# Uncomment after creating a KV namespace in Cloudflare Dashboard.
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"

[triggers]
crons = ["0 0 1 * *"]

# Optional secret / variable:
# GITHUB_TOKEN = live GitHub template discovery token
# Set secrets with the Cloudflare Dashboard or `wrangler secret put GITHUB_TOKEN`.
