# ═══════════════════════════════════════════════════════════
# wrangler.toml — one-click-deploy Worker
# ═══════════════════════════════════════════════════════════

name               = "one-click-deploy"
main               = "worker.js"
compatibility_date = "2024-09-23"

# ── KV Namespace ────────────────────────────────────────────
# REMOVED for now — worker.js falls back to embedded static
# templates automatically when KV is not bound.
#
# To enable KV caching later:
#   Step 1. Cloudflare Dashboard → Workers & Pages → KV
#           → "Create namespace" → name it anything (e.g. DEPLOY_KV)
#           → copy the ID shown after creation
#
#   Step 2. Uncomment the block below and paste the real ID:
#
# [[kv_namespaces]]
# binding    = "KV"
# id         = "paste-your-real-32-char-id-here"
# preview_id = "paste-your-real-preview-id-here"
#
#   Step 3. Commit wrangler.toml → Workers Builds auto-redeploys

# ── Monthly cron: clear template cache on the 1st ──────────
[triggers]
crons = ["0 0 1 * *"]

# ── Secrets (set in Dashboard → Worker → Settings → Variables)
# GITHUB_TOKEN — optional, enables live GitHub template fetching
