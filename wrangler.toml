# ═══════════════════════════════════════════════════════════
# wrangler.toml — 一键建站平台 API Worker
# Deploy: wrangler deploy
# ═══════════════════════════════════════════════════════════

name              = "deploy-tool-api"
main              = "worker.js"          # pure JavaScript only
compatibility_date = "2024-09-23"

# ── KV Namespace (optional but recommended) ─────────────────
# Used for: template caching (30 days) + deploy status logs
#
# SETUP STEPS:
#   1. Run: wrangler kv namespace create "DEPLOY_KV"
#   2. Copy the printed id into the field below
#   3. Run: wrangler kv namespace create "DEPLOY_KV" --preview
#   4. Copy the preview id below
#
[[kv_namespaces]]
binding    = "KV"
id         = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"

# ── Cron: auto-refresh template cache every 1st of month ───
[triggers]
crons = ["0 0 1 * *"]

# ── Secrets — set via CLI, NEVER hardcode here ─────────────
# wrangler secret put GITHUB_TOKEN
# (optional — enables live GitHub template fetching)
